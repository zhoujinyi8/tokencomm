# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -m "not integration"
    - name: Verify reproduction protocol contracts
      working-directory: scheduled_reproduction/experiment/tokencom_inspect/tokencom_reproduction
      run: |
        python -c "from test_packet_arq_accounting import verify; result = verify(); assert result['passed'] == 8 and result['failed'] == 0; print(result)"
        python -c "from test_arq_metric_checks import verify; result = verify(); assert result['passed'] == 6 and result['failed'] == 0; print(result)"
        python -c "from test_matched_recovery_checks import verify; result = verify(); assert result['passed'] == 6 and result['failed'] == 0; print(result)"
        python -c "from test_cheng_stream_container import verify; result = verify(); assert result['passed'] == 8 and result['failed'] == 0; print(result)"
        python -c "from test_cheng_packet_budget import verify; result = verify(); assert result['passed'] == 6 and result['failed'] == 0; print(result)"
        python -c "from test_imagenet100_manifest import verify; result = verify(); assert result['passed'] == 9 and result['failed'] == 0; print(result)"
        python -c "from test_cheng_rate_selection import verify; result = verify(); assert result['passed'] == 9 and result['failed'] == 0; print(result)"
        python -c "from test_cheng_byte_transport import verify; result = verify(); assert result['passed'] == 8 and result['failed'] == 0; print(result)"
